<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Moment</title>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  background:black;
}

#intro{
  position:fixed;
  inset:0;
  background:url("photo.jpg") center/cover no-repeat;
}

.text-box{
  position:absolute;
  left:50%;
  top:15%;              /* 🔼 هون بتتحكّم بالعلو */
  transform:translateX(-50%);
  background:rgba(0,0,0,0.45);
  padding:16px 28px;
  border-radius:12px;
  text-align:center;
  color:white;
  font-family: Georgia, serif;
}

.text-box h1{
  margin:0;
  font-size:28px;
  letter-spacing:1px;
}

.text-box p{
  margin-top:10px;
  font-size:16px;
}
</style>
</head>

<body>

<div id="intro">
  <div class="text-box">
    <h1>Hassan & Maha</h1>
    <p>Forever begins here❤️</p>
  </div>
</div>

<audio id="music">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("touchstart", () => {
  document.getElementById("music").play();
}, { once:true });
</script>

</body>
</html>
